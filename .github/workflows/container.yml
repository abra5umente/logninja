name: Container

on:
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Fork PRs get a read-only token, so they build and smoke-test but don't push.
  PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name logninja -p 8080:80 "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080/ | grep -q '<div id="root">' && exit 0
            sleep 1
          done
          docker logs logninja
          exit 1
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: env.PUSH == 'true'
        run: |
          docker push --all-tags "${{ env.IMAGE }}"
          echo "Pull with: \`docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
