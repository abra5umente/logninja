name: Container

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: logninja:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name logninja -p 8080:80 logninja:ci
          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080/ | grep -q '<div id="root">' && exit 0
            sleep 1
          done
          docker logs logninja
          exit 1
